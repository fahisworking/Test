<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple To-Do</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>To-Do List</h1>

    <form id="todo-form" class="add-form">
      <label for="todo-input" class="visually-hidden">New task</label>
      <input id="todo-input" type="text" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list" class="todo-list"></ul>

    <footer class="summary">
      <span id="todo-count"></span>
      <button id="clear-done" type="button" class="link-button">Clear completed</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
